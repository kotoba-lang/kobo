name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No sibling clone: deps are git coordinates, so this job proves kobo is
      # consumable from outside a monorepo checkout rather than only that it
      # compiles next to its siblings.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      # Portable model + the console, including its deterministic
      # HIG/WCAG score gate. Cannot load kobo.host.*, which is
      # ClojureScript on Node by design.
      - run: clojure -M:test
      - run: clojure -M:lint

  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      # Actually spawns processes AND serves the console over real HTTP:
      # proves a receipt describes a command that really ran, and that the
      # page a browser gets is produced by the runtime that really serves it.
      - run: npm run test:host

  # console を kotoba-lang/browser で render する gate。
  # browser は git 座標で consume できない（dom-gpu ↔ cssom ↔ htmldom の
  # :local/root 循環）ので、browser 自身の CI と同じく sibling を clone する。
  browser-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: Checkout the kotoba browser engine and its siblings
        run: |
          for r in browser dom-gpu cssom htmldom quickjs org-w3-aria devtools; do
            git clone --depth 1 https://github.com/kotoba-lang/$r ../$r
          done
      - run: clojure -M:browser-render:test -d test-browser
